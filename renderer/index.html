<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src file:; img-src 'self' data: file:; style-src 'self'; script-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <button id="appmenu" class="tb-btn" title="Menu"><span class="ico" data-ico="menu"></span></button>
    <button id="navback" class="tb-btn" title="Back (Alt+Left)"><span class="ico" data-ico="back"></span></button>
    <button id="navfwd" class="tb-btn" title="Forward (Alt+Right)"><span class="ico flip" data-ico="back"></span></button>
    <span id="testbadge" class="tb-test" hidden title="Running from source with a copy of your settings, not the installed app">Test build</span>
    <div id="tabs" role="tablist">
      <div id="libtab" class="tab libtab active" role="tab"><span id="libicon"></span><span class="tname" id="libname">All clips</span><span id="libcount"></span></div>
    </div>
    <div class="tb-fill"></div>
    <button id="updbtn" class="tb-upd" hidden title="Restart to update"><span class="ico" data-ico="download"></span><span id="updtext">Update ready</span></button>
    <div class="tb-wc"></div>
  </header>

  <section id="library">
    <nav id="libside">
      <div id="sidehead">
        <button id="sidetoggle"><span class="ico tg-collapse" data-ico="sideClose"></span><span class="ico tg-lib" data-ico="library"></span><span class="ico tg-open" data-ico="sideOpen"></span><span class="sidename">Your Library</span></button>
      </div>
      <div id="folderbox">
        <button id="folderbtn" data-rail-tip="Folders"><span class="ico" data-ico="folder"></span><span id="foldertext">All folders</span><span class="ico chev" data-ico="chev"></span></button>
        <div id="folderpanel"><div id="folderlist"></div></div>
      </div>
      <div id="sidefixed"></div>
      <div id="gamesbar">
        <button id="gsearchbtn" class="gbar-ico" data-rail-tip="Search games"><span class="ico" data-ico="search"></span></button>
        <label id="gsearch" class="search"><span class="ico" data-ico="search"></span><input id="gsearchin" type="text" placeholder="Search games" spellcheck="false"><button id="gsearchx" class="gsx" title="Clear"><span class="ico" data-ico="x"></span></button></label>
        <button id="gsortbtn" class="sortbtn gsort"><span id="gsorttext">Recent</span><span class="ico" data-ico="sort"></span></button>
      </div>
      <div id="games"></div>
      <div id="edittabs"></div>
      <div id="sidegrip" title="Drag to resize, double-click to reset"></div>
    </nav>
    <div id="libmain">
      <div class="libhead">
        <div class="selbar" id="selbar" hidden>
          <span id="seltext"></span>
          <button class="btn sm ghost" id="selall">Select all</button>
          <button class="btn sm ghost" id="selcopy"><span class="ico" data-ico="copy"></span>Copy</button>
          <button class="btn sm ghost danger" id="seldel"><span class="ico" data-ico="trash"></span>Delete</button>
          <button class="ibtn sm" id="selclear" title="Clear selection (Esc)"><span class="ico" data-ico="x"></span></button>
        </div>
        <div class="libtools" id="libtools">
          <label class="search"><span class="ico" data-ico="search"></span><input id="libsearch" type="text" placeholder="Search" spellcheck="false"></label>
          <div class="chips" id="libkinds"></div>
          <button id="libsort" class="sortbtn" title="Sort"><span class="ico" data-ico="sort"></span><span id="sorttext">Newest</span><span class="ico chev" data-ico="chev"></span></button>
        </div>
      </div>
      <div id="libscroll"><div id="libgrid"></div></div>
    </div>
    <div id="libtoast"></div>
  </section>
</div>

<div id="setov" hidden>
  <div class="set-box" role="dialog" aria-label="Settings">
    <div class="set-head"><h2>Settings</h2><button class="ibtn" id="setclose" title="Close (Esc)"><span class="ico" data-ico="x"></span></button></div>
    <div class="set-scroll"><div id="setbody"></div></div>
  </div>
</div>

<div id="qt" hidden>
  <div class="qt-box trim" role="region" aria-label="Edit clip">
    <aside class="qt-clips" id="qtclips">
      <div class="qt-clipshead"><span class="qt-clipstitle" id="qtclipstitle">Clips</span><button class="gpick" id="qtgamepick"></button></div>
      <div class="qt-listwrap"><div class="qt-cliplist" id="qtcliplist"></div></div>
      <div class="qt-assets" id="qtassets"></div>
      <div class="qt-vgrip" id="qtclipsgrip" title="Drag to resize, double-click to reset"></div>
    </aside>
    <div class="qt-main">
      <div class="qt-head">
        <div class="qt-titles">
          <div class="qt-titlerow">
            <button class="qt-title" id="qttitle" title="Rename"><span id="qttitletext"></span><span class="ico" data-ico="edit"></span></button>
            <input id="qttitlein" type="text" spellcheck="false" maxlength="120" hidden>
          </div>
          <div class="qt-sub" id="qtsub"></div>
        </div>
        <button class="btn sm qt-mode" id="qtedit-btn" title="Text, shapes, zoom, blur, music and more, on a full timeline (E)"><span class="ico" data-ico="edit"></span><span>Edit</span></button>
        <button class="btn sm qt-mode" id="qttrim-btn" title="Back to the quick trim (E)"><span class="ico" data-ico="scissors"></span><span>Back to Trim</span></button>
        <div class="qt-saving">
          <button class="btn sm qt-mode" id="qtcancel-btn" title="Discard the changes made in Edit and go back to Trim (E)">Cancel</button>
          <button class="btn sm primary qt-mode" id="qtsave-btn" title="Keep the changes and go back to Trim">Save Changes</button>
        </div>
      </div>
      <div class="qt-stage" id="qtstage"><div class="qt-view" id="qtview"><canvas id="qtcanvas"></canvas><video id="qtvideo" hidden></video><div class="qt-levels" id="qtlevels"></div><div class="qt-edit" id="qtedit"></div></div><div class="qt-msg" id="qtmsg"></div><div class="qt-flash" id="qtflash"></div></div>
      <div class="qt-tl" id="qttl">
        <div class="qt-bar">
          <div class="qt-time"><b id="qtcur">0:00.00</b> / <span id="qttot">0:00.00</span><span class="qt-frame" id="qtframe"></span></div>
          <div class="qt-transport">
            <button class="ibtn sm" id="qtmarkin" title="Set the start here (I)"><span class="ico" data-ico="markIn"></span></button>
            <button class="ibtn sm" id="qtfback" title="One frame back (,)"><span class="ico" data-ico="frameBack"></span></button>
            <button class="ibtn sm" id="qttostart" title="Jump to the start of the trim (Home)"><span class="ico" data-ico="toStart"></span></button>
            <button class="ibtn sm" id="qtback" title="Back 10 seconds (J)"><span class="ico" data-ico="back10"></span></button>
            <button class="ibtn qt-play" id="qtplay" title="Play / pause (Space)"><span class="ico" data-ico="play"></span></button>
            <button class="ibtn sm" id="qtfwd" title="Forward 10 seconds (L)"><span class="ico" data-ico="fwd10"></span></button>
            <button class="ibtn sm" id="qttoend" title="Jump to the end of the trim (End)"><span class="ico" data-ico="toEnd"></span></button>
            <button class="ibtn sm" id="qtffwd" title="One frame forward (.)"><span class="ico" data-ico="frameFwd"></span></button>
            <button class="ibtn sm" id="qtmarkout" title="Set the end here (O)"><span class="ico" data-ico="markOut"></span></button>
          </div>
          <div class="qt-barright">
            <button class="ibtn sm on" id="qtloop" title="Loop the trim while playing"><span class="ico" data-ico="loop"></span></button>
          </div>
        </div>
        <div class="qt-lane" id="qtlane">
          <div class="qt-ruler" id="qtruler"></div>
          <canvas class="qt-wave" id="qtwave"></canvas>
          <div class="qt-stripwrap"><canvas class="qt-strip" id="qtstrip"></canvas></div>
          <div class="qt-shade" id="qtshadeL"></div><div class="qt-shade" id="qtshadeR"></div>
          <div class="qt-sel" id="qtsel"><div class="qt-grip" id="qtgin"></div><div class="qt-grip" id="qtgout"></div></div>
          <div class="qt-ph" id="qtph"><div class="knob"></div></div>
        </div>
      </div>
    </div>
    <aside class="qt-side">
      <div class="qt-vgrip left" id="qtsidegrip" title="Drag to resize, double-click to reset"></div>
      <div class="qt-top">
        <div class="qt-listen" id="qtlisten">
            <button class="ibtn sm" id="qtlmute" title="Mute listening (the export is not affected)"><span class="ico" data-ico="headphones"></span></button>
            <input type="range" id="qtlvol" min="0" max="100" step="1" value="100" title="Listening volume (the export is not affected)">
        </div>
        <span class="qt-topsp"></span>
        <button class="ibtn sm" id="qtreveal" title="Show in Folder"><span class="ico" data-ico="folder"></span></button>
        <button class="ibtn sm" id="qthelp" title="Shortcuts"><span class="ico" data-ico="help"></span></button>
        <button class="ibtn sm" id="qtmore" title="More"><span class="ico" data-ico="more"></span></button>
        <button class="ibtn sm" id="qtclose" title="Close (Esc)"><span class="ico" data-ico="x"></span></button>
      </div>
      <div class="qt-scroll">
        <h4 id="qtfxpropsh">Clip</h4>
        <div class="qt-card qt-fxprops" id="qtfxprops"></div>
        <div class="qt-clipprops">
        <h4>Trim</h4>
        <div class="qt-card qt-trim">
          <label for="qtin">Start</label><input type="text" class="qt-t" id="qtin" spellcheck="false" title="Type a time and press Enter (I sets it to the playhead)">
          <label for="qtout">End</label><input type="text" class="qt-t" id="qtout" spellcheck="false" title="Type a time and press Enter (O sets it to the playhead)">
          <div class="qt-speedrow"><label>Speed</label><div class="qt-speed" id="qtspeed"></div></div>
          <div class="qt-len"><b id="qtlen">0:00.00</b><span id="qtof"></span></div>
          <button class="btn sm ghost" id="qtreset" title="Back to the whole clip">Reset</button>
          <div class="qt-size" id="qtsize" title="Estimated size of the clip when you drag, copy or export it"></div>
        </div>
        <h4>Audio</h4>
        <div class="qt-card qt-audio" id="qtaudio"></div>
        </div>
      </div>
      <div class="qt-foot">
        <div class="qt-status" id="qtstatus"></div>
        <progress id="qtbar" max="1" value="0" hidden></progress>
        <div class="qt-split primary">
          <button class="btn primary" id="qtcopy" title="Copy the trimmed clip, then paste it into Discord with Ctrl+V (Ctrl+C)"><span class="ico" data-ico="copy"></span>Copy Video</button><button class="btn primary" id="qtcopymenu" title="More copy options"><span class="ico chev" data-ico="chev"></span></button>
        </div>
        <div class="qt-split" id="qtsavegrp">
          <button class="btn" id="qtsave" title="Export the trimmed clip to your Trimmed folder"><span class="ico" data-ico="export"></span>Export</button><button class="btn" id="qtsavemenu" title="More export options"><span class="ico chev" data-ico="chev"></span></button>
        </div>
      </div>
    </aside>
    <div class="etl" id="qtetl">
      <div class="qt-hgrip" id="qttlgrip" title="Drag to resize, double-click to reset"></div>
      <div class="etl-bar">
        <div class="etl-tools">
          <button class="ibtn sm on" id="etlselect" title="Select and move (V)"><span class="ico" data-ico="select"></span></button>
          <button class="ibtn sm" id="etlrazor" title="Razor: click a block or a sound row to cut it there (C)"><span class="ico" data-ico="razor"></span></button>
          <button class="ibtn sm" id="etlsnap" title="Snapping (hold Alt to do the opposite)"><span class="ico" data-ico="snap"></span></button>
          <span class="etl-sep"></span>
          <button class="ibtn sm" id="qtundo" title="Undo (Ctrl+Z)" disabled><span class="ico" data-ico="undo"></span></button>
          <button class="ibtn sm" id="qtredo" title="Redo (Ctrl+Shift+Z)" disabled><span class="ico" data-ico="redo"></span></button>
          <span class="etl-time"><b id="etlcur">0:00.00</b> / <span id="etllen">0:00.00</span></span>
        </div>
        <div class="etl-transport">
          <button class="ibtn sm" id="etlmarkin" title="Set the start here (I)"><span class="ico" data-ico="markIn"></span></button>
          <button class="ibtn sm" id="etlfback" title="One frame back (,)"><span class="ico" data-ico="frameBack"></span></button>
          <button class="ibtn sm" id="etltostart" title="Jump to the start of the trim (Home)"><span class="ico" data-ico="toStart"></span></button>
          <button class="ibtn sm" id="etlback" title="Back 10 seconds (J)"><span class="ico" data-ico="back10"></span></button>
          <button class="ibtn qt-play" id="etlplay" title="Play / pause (Space)"><span class="ico" data-ico="play"></span></button>
          <button class="ibtn sm" id="etlfwd" title="Forward 10 seconds (L)"><span class="ico" data-ico="fwd10"></span></button>
          <button class="ibtn sm" id="etltoend" title="Jump to the end of the trim (End)"><span class="ico" data-ico="toEnd"></span></button>
          <button class="ibtn sm" id="etlffwd" title="One frame forward (.)"><span class="ico" data-ico="frameFwd"></span></button>
          <button class="ibtn sm" id="etlmarkout" title="Set the end here (O)"><span class="ico" data-ico="markOut"></span></button>
        </div>
        <div class="etl-zoom">
          <button class="ibtn sm on" id="etlloop" title="Loop the trim while playing"><span class="ico" data-ico="loop"></span></button>
          <span class="etl-sep"></span>
          <span class="ico" data-ico="zoom"></span>
          <input type="range" id="etlzoom" min="0" max="100" step="0.5" value="0" title="Zoom the timeline (Ctrl+wheel)">
          <button class="ibtn sm" id="etlfit" title="Fit the trim"><span class="ico" data-ico="fit"></span></button>
        </div>
      </div>
      <div class="etl-ov" id="etlov" title="Drag to scroll the timeline"><div class="etl-ovtrim"></div><div class="etl-ovwin"></div><div class="etl-ovph"></div></div>
      <div class="etl-ruler" id="etlruler"></div>
      <div class="etl-tracks" id="qttracks"></div>
      <div class="etl-ph" id="etlph"></div>
    </div>
  </div>
</div>
</div>

<div id="drop"><div class="drop-card"><div class="drop-icon"><span class="ico" data-ico="fileOpen"></span></div><div class="drop-title">Drop to edit</div><div class="drop-sub">Drop a folder to add it to your library</div></div></div>
<div id="ctxmenu" hidden></div>
<div id="tip" hidden></div>
<script src="timemap.js"></script>
<script type="module" src="engine.mjs"></script>
<script src="app.js"></script>
<script src="library.js"></script>
<script type="module" src="quicktrim.mjs"></script>
</body>
</html>
